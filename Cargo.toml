[package]
name = "quoto"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "schema-sync"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1.29.3", default-features = false, features = ["std"] }

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
