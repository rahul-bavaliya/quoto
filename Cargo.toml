[package]
name = "quoto"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
dotenvy = "0.15.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "schema-sync"] }
subtle = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1.29.3", default-features = false, features = ["std"] }
utoipa = "6"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Smaller builds: keep the line numbers in error messages and backtraces, but not the full
# debugger information. (The default made the `target/` folder so big that a Codespace ran out of disk.)
[profile.dev]
debug = "line-tables-only"
