[package]
name = "quoto"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1.29.3", default-features = false, features = ["std"] }

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
